# Stack descartável para a validação de integração, independente do Compose de desenvolvimento.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: systemx_verify
      MYSQL_USER: systemx_verify
      MYSQL_PASSWORD: ${SYSTEMX_VERIFY_DB_PASSWORD:?defina SYSTEMX_VERIFY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SYSTEMX_VERIFY_ROOT_PASSWORD:?defina SYSTEMX_VERIFY_ROOT_PASSWORD}
    volumes:
      - verify-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 4s
      retries: 25

  backend:
    build:
      context: ./senai
    environment:
      DB_URL: jdbc:mysql://db:3306/systemx_verify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: systemx_verify
      DB_PASSWORD: ${SYSTEMX_VERIFY_DB_PASSWORD:?defina SYSTEMX_VERIFY_DB_PASSWORD}
      JWT_SECRET: ${SYSTEMX_VERIFY_JWT_SECRET:?defina SYSTEMX_VERIFY_JWT_SECRET}
      APP_JWT_EXPIRATION_SECONDS: "20"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5177
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      WHATSAPP_ENABLED: "false"
      MAIL_ENABLED: "false"
      STRIPE_ENABLED: "false"
      BILLING_SIMULATION_ENABLED: "false"
      GROQ_ENABLED: "false"
      DEV_TOKEN_ENABLED: "false"
      EVOLUTION_API_URL: http://127.0.0.1:1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/v3/api-docs"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  frontend:
    build:
      context: ../Front-End
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "127.0.0.1:5177:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  verify-mysql:
