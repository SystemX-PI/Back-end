services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: senai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - senai-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./senai
    environment:
      DB_URL: jdbc:mysql://db:3306/senai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: local-development-secret-change-before-deploying
      DEV_TOKEN_ENABLED: "true"
      DEV_API_TOKEN: token-local-123
      MAIL_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  senai-mysql-data: