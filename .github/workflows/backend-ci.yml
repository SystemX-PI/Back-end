name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: senai

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar os testes
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Guardar relatorios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: senai/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
