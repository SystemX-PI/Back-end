name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: senai

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar os testes
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Guardar relatorios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: senai/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    name: mysql-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=4s --health-retries=20
    defaults:
      run:
        working-directory: senai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Preparar schemas descartáveis
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$password"
          {
            printf "CREATE USER 'systemx_lote03_test'@'%%' IDENTIFIED BY '%s';\n" "$password"
            for schema in systemx_lote03_test systemx_flyway_fresh systemx_flyway_upgrade; do
              printf "CREATE DATABASE %s CHARACTER SET utf8mb4; GRANT ALL ON %s.* TO 'systemx_lote03_test'@'%%';\n" "$schema" "$schema"
            done
          } | docker exec -i "$MYSQL_CONTAINER" mysql -u root
          printf 'SYSTEMX_LOTE03_MYSQL_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Verificar persistência, concorrência e migrações
        env:
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: >
          mvn -B -ntp
          -Dtest=ProcessoOperacaoIntegrationTest,StripeBillingIntegrationTest,FlywayMigrationIntegrationTest
          -Dsystemx.test.mysql.port="$TEST_MYSQL_PORT"
          -Dsystemx.test.flyway.port="$TEST_MYSQL_PORT"
          verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorios-mysql
          path: senai/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7
