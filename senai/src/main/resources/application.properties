spring.config.import=optional:file:./application-local.properties

spring.application.name=senai
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/senai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Token fixo somente para testes locais. Remova ou desative em produÃ§Ã£o.
app.security.dev-token-enabled=false
app.security.dev-token=

app.integration.api-key=${INTEGRATION_API_KEY:}

# Gmail: use uma senha de aplicativo, nunca a senha normal da conta.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# Evolution API local
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-url=${EVOLUTION_API_URL:http://localhost:8081}
app.whatsapp.api-key=${EVOLUTION_API_KEY:}
app.whatsapp.instance=${EVOLUTION_INSTANCE:consorcio}

app.evolution.url=${EVOLUTION_API_URL:http://127.0.0.1:8081}
app.evolution.api-key=${EVOLUTION_API_KEY:${AUTHENTICATION_API_KEY:}}
app.billing.simulation-enabled=${BILLING_SIMULATION_ENABLED:false}
app.billing.stripe.enabled=${STRIPE_ENABLED:false}
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.monthly-price-id=${STRIPE_MONTHLY_PRICE_ID:}
app.billing.stripe.monthly-price-cents=${STRIPE_MONTHLY_PRICE_CENTS:0}
app.billing.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/app/assinatura?stripe=success}
app.billing.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/app/upgrade?stripe=cancelled}

# Assistente operacional: a chave fica somente no ambiente do servidor.
app.assistant.groq.enabled=${GROQ_ENABLED:false}
app.assistant.groq.api-key=${GROQ_API_KEY:}
app.assistant.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Only explicitly trusted proxies may supply the password recovery source IP.
app.security.password-reset.trusted-proxies=${PASSWORD_RESET_TRUSTED_PROXIES:}

# A API autentica via JWT e não usa o usuário em memória do Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
